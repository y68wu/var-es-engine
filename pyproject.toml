[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-var-es-engine"
version = "1.0.0"
description = "Full-revaluation market risk for a CAD multi-asset portfolio with FX options"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "requests>=2.32,<3",
    "scipy>=1.12,<2",
    "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
cad-var-es = "var_es.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
